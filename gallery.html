<!-- gallery.html -->
<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерей</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .slider {
      position: relative;
      width: 80%;
      margin: 50px auto;
      overflow: hidden;
      border-radius: 10px;
    }
    .slides {
      display: flex;
      width: 400%;
      transition: transform 0.5s ease-in-out;
    }
    .slides img {
      width: 100%;
      height: auto;
    }
    .navigation {
      text-align: center;
      margin-top: 10px;
    }
    .navigation button {
      padding: 8px 12px;
      margin: 0 5px;
      background: #3498db;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Галерей</h1>
    <nav>
      <ul>
        <li><a href="index.html">Нүүр</a></li>
        <li><a href="services.html">Үйлчилгээ</a></li>
        <li><a href="pricing.html">Үнийн Жагсаалт</a></li>
        <li><a href="gallery.html">Галерей</a></li>
        <li><a href="contact.html">Холбоо Барих</a></li>
      </ul>
    </nav>
  </header>

  <div class="slider">
    <div class="slides" id="slideContainer">
      <img src="Leisuwash-first-project-in-Mongolia.jpg" alt="Угаалгын зураг 1">
      <img src="GxJsqWEaBEQXmashin_ugaalga__17_.jpg" alt="Угаалгын зураг 2">
      <img src="download (1).jpeg" alt="Угаалгын зураг 3">
      <img src="download.jpeg" alt="Угаалгын зураг 4">
    </div>
  </div>
  <div class="navigation">
    <button onclick="prevSlide()">Өмнөх</button>
    <button onclick="nextSlide()">Дараах</button>
  </div>

  <footer>
    <p>&copy; 2025 Машин Угаалга. Бүх эрх хуулиар хамгаалагдсан.</p>
  </footer>

  <script>
    let index = 0;
    function showSlide(i) {
      const slides = document.getElementById('slideContainer');
      const total = slides.children.length;
      index = (i + total) % total;
      slides.style.transform = `translateX(-${index * 100}%)`;
    }
    function nextSlide() {
      showSlide(index + 1);
    }
    function prevSlide() {
      showSlide(index - 1);
    }
    setInterval(nextSlide, 4000);
  </script>
</body>
</html>
